name: FZ Office shell validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Test legacy Hindi converter library
        run: node tests/legacy-converter.test.js

      - name: Verify normal viewer never auto-converts
        run: node tests/viewer-font-policy.test.js
 
      - name: Verify DOCX page dimensions and margins
        run: node tests/docx-page-layout.test.js

      - name: Verify edge-to-edge insets and document zoom
        run: node tests/system-bar-insets.test.js

      - name: Verify font-import safety and view-only font library
        run: node tests/font-import-safety.test.js

      - name: Verify Office viewer routing and local asset pinning
        run: node tests/office-viewer-routing.test.js

      - name: Verify Writer edit mode and safe Save As
        run: node tests/writer-edit-mode.test.js

      - name: Verify local document library
        run: node tests/file-library.test.js

      - name: Verify offline PDF reader
        run: node tests/pdf-viewer.test.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: FZ-Office-shell-preview
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
