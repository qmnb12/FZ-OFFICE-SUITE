name: FZ Office shell validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.14904198"

      - name: Install MJ PDF native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-requests

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Test legacy Hindi converter library
        run: node tests/legacy-converter.test.js

      - name: Verify normal viewer never auto-converts
        run: node tests/viewer-font-policy.test.js
 
      - name: Verify DOCX page dimensions and margins
        run: node tests/docx-page-layout.test.js

      - name: Verify Kotlin-owned DOCX core
        run: node tests/docx-kotlin-core.test.js

      - name: Verify shared document viewer architecture
        run: node tests/common-viewer.test.js

      - name: Verify edge-to-edge insets and document zoom
        run: node tests/system-bar-insets.test.js

      - name: Verify font-import safety and view-only font library
        run: node tests/font-import-safety.test.js

      - name: Verify Office viewer routing and local asset pinning
        run: node tests/office-viewer-routing.test.js

      - name: Verify DOCX and TXT remain view-only
        run: node tests/writer-view-only.test.js

      - name: Verify DOCX viewer startup performance
        run: node tests/viewer-performance.test.js

      - name: Verify custom XLSX edit mode
        run: |
          node --check app/src/main/assets/writer/sheet-editor.js
          node tests/xlsx-editor.test.js

      - name: Verify local document library
        run: node tests/file-library.test.js

      - name: Verify offline PDF reader
        run: node tests/pdf-viewer.test.js

      - name: Verify FZ platform PDF core
        run: node tests/pdf-kotlin-core.test.js

      - name: Restore persistent testing signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ALLOW_UNSIGNED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_BASE64:-}" ]; then
            if [ "${ALLOW_UNSIGNED_PR:-false}" = "true" ]; then
              echo "Fork pull request: repository secrets are unavailable; using the temporary debug key."
              exit 0
            fi
            echo "::error::Persistent signing secrets are missing. Refusing to publish an APK signed with a temporary debug key."
            exit 1
          fi
          if [ -z "${SIGNING_KEY_ALIAS:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ] || [ -z "${SIGNING_STORE_PASSWORD:-}" ]; then
            echo "::error::One or more persistent signing secrets are missing."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/fz-testing.jks"
          test -s "$RUNNER_TEMP/fz-testing.jks"
          keytool -list -keystore "$RUNNER_TEMP/fz-testing.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
          echo "FZ_TESTING_KEYSTORE=$RUNNER_TEMP/fz-testing.jks" >> "$GITHUB_ENV"

      - name: Build MJ PDF native libraries with NDK
        run: gradle --no-daemon :third_party:mj_pdf:PdfiumAndroid:buildMjPdfNativeDependencies

      - name: Stage prebuilt PDFium JNI libraries for on-device builds
        run: |
          set -euo pipefail
          SOURCE="third_party/mj_pdf/PdfiumAndroid/src/main/libs"
          DEST="third_party/mj_pdf_prebuilt"
          test -d "$SOURCE"
          mkdir -p "$DEST"
          cp -a "$SOURCE/." "$DEST/"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            for lib in libmodpdfium.so libmodft2.so libmodpng.so libc++_shared.so libjniPdfium.so; do
              test -s "$DEST/$abi/$lib" || { echo "::error::Missing $abi/$lib"; exit 1; }
            done
          done

      - name: Commit prebuilt PDFium libraries for COTG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Add prebuilt PDFium libraries for on-device builds"
          file_pattern: "third_party/mj_pdf_prebuilt/**/*.so"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build debug APK
        env:
          FZ_TESTING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          FZ_TESTING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          FZ_TESTING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signing certificate
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ALLOW_UNSIGNED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not found."
            exit 1
          fi
          if [ -n "${SIGNING_KEY_BASE64:-}" ]; then
            EXPECTED_CERT="$(keytool -list -v -keystore "$RUNNER_TEMP/fz-testing.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':\r\n' | tr '[:upper:]' '[:lower:]')"
            ACTUAL_CERT="$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':\r\n' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$EXPECTED_CERT" ] || [ -z "$ACTUAL_CERT" ] || [ "$EXPECTED_CERT" != "$ACTUAL_CERT" ]; then
              echo "::error::APK signing certificate does not match the persistent testing keystore."
              echo "Expected SHA-256: $EXPECTED_CERT"
              echo "Actual SHA-256:   $ACTUAL_CERT"
              exit 1
            fi
            echo "Verified persistent testing certificate: $ACTUAL_CERT"
          elif [ "${ALLOW_UNSIGNED_PR:-false}" = "true" ]; then
            echo "Temporary debug certificate allowed only for fork pull-request validation."
          else
            echo "::error::Persistent signing key unavailable; refusing to upload this APK."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: FZ-Office-shell-preview
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
