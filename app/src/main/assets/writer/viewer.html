<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4, user-scalable=yes">
<meta name="color-scheme" content="light">
<title>FZ Office Document Viewer</title>
<link rel="preload" href="fonts/NotoSansDevanagari-VF.ttf" as="font" type="font/ttf" crossorigin>
<style>
:root{color-scheme:light;--ink:#1b342d;--muted:#718078;--paper:#fff;--canvas:#e9efeb;--line:#d9e2dc}
*{box-sizing:border-box}
/* Keep one-finger page scrolling and allow native two-finger WebView zoom. */
html{touch-action:manipulation}
html,body{margin:0;width:100%;height:100%;background:var(--canvas);color:var(--ink);font-family:"Noto Sans Devanagari",Arial,sans-serif;font-kerning:normal;text-rendering:optimizeLegibility}
body{display:flex;flex-direction:column;overflow:hidden}
#legacyNotice{display:none;flex:0 0 auto;max-width:900px;margin:10px auto 0;padding:10px 13px;border-radius:10px;background:#fff4dc;color:#6c4c12;font-size:12px;line-height:1.5;border:1px solid #f0dfb9;width:calc(100% - 20px)}
#legacyNotice strong{display:block;margin-bottom:3px}
#viewer-scroll{width:100%;min-height:0;flex:1 1 auto;overflow:auto;overscroll-behavior:contain;padding:16px 8px 30px}
#pages{display:flex;flex-direction:column;align-items:center;width:100%}
.page-shell{position:relative;flex:0 0 auto;width:var(--fz-shell-width,auto);height:var(--fz-shell-height,auto);margin:0 auto var(--fz-page-gap,28px)}
.fz-page{position:absolute;left:0;top:0;width:var(--fz-page-width,auto);height:var(--fz-page-height,auto);padding:var(--fz-page-padding,0);transform:var(--fz-page-transform,scale(1));transform-origin:top left;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:2px;box-shadow:0 2px 12px rgba(23,55,43,.11);color:#202b26;font-size:11pt;line-height:1.15;overflow-wrap:break-word;word-break:normal;user-select:text;-webkit-user-select:text;font-family:var(--fz-page-font-family,"Noto Sans Devanagari",Arial,sans-serif);font-feature-settings:"kern" 1,"liga" 1}
.fz-page p,.fz-page div{margin:0}
.fz-page h1{font-size:1.65em;line-height:1.15;margin:0}
.fz-page h2{font-size:1.35em;line-height:1.15;margin:0}
.fz-page h3{font-size:1.15em;line-height:1.15;margin:0}
.fz-page ul,.fz-page ol{padding-left:25px;margin:0}
.fz-page table{width:100%;border-collapse:collapse;table-layout:fixed;margin:0;break-inside:auto}
.fz-page tr{break-inside:avoid;page-break-inside:avoid}
.fz-page td,.fz-page th{border:1px solid #9eafa7;padding:7px;min-width:35px;vertical-align:top}
.fz-page p[data-fz-keep-lines="true"]{break-inside:avoid;page-break-inside:avoid}
.fz-page p[data-fz-keep-next="true"]{break-after:avoid;page-break-after:avoid}
.fz-page blockquote{border-left:3px solid #9ab8a9;margin:12px 0;padding:5px 12px;color:#52655c}
.fz-page img{max-width:100%;height:auto}
.fz-page a{color:#176b5b;text-decoration:underline}
.page-number{position:absolute;right:8px;bottom:4px;color:#738078;font:10px Arial,sans-serif;pointer-events:none;transform:var(--fz-page-number-transform,scale(1));transform-origin:bottom right}
.fz-measure{position:fixed!important;left:-100000px!important;top:0!important;transform:none!important;visibility:hidden!important;box-shadow:none!important;border:0!important}
.page-shell[data-overflow="true"] .fz-page{outline:2px solid #c96f38;overflow:visible;height:auto!important;min-height:var(--fz-page-height)}
@media print{html,body{height:auto;overflow:visible;background:#fff}#legacyNotice{display:none!important}#viewer-scroll{overflow:visible;padding:0}#pages{display:block}.page-shell{break-after:page;margin:0!important}.fz-page{border:0;box-shadow:none;transform:none!important}}
</style>
</head>
<body>
<div id="legacyNotice" role="status"></div>
<main id="viewer-scroll" aria-label="Document pages"><div id="pages"></div></main>
<script>
(function(){
"use strict";
var root=document.getElementById("pages"),scroll=document.getElementById("viewer-scroll"),notice=document.getElementById("legacyNotice");
var defaultFont="Noto Sans Devanagari",layout={widthTwips:11906,heightTwips:16838,topTwips:1440,rightTwips:1440,bottomTwips:1440,leftTwips:1440};
var zoomLevel=1,ready=false,paginationBusy=false,paginationGeneration=0,lastDocument=null;
function px(twips){return Math.max(0,Number(twips)||0)/15}
function pages(){return Array.prototype.slice.call(root.querySelectorAll(".page-shell > .fz-page"))}
function shellOf(page){return page&&page.parentElement}
function widthScale(){
 var width=px(layout.widthTwips),available=Math.max(240,(scroll.clientWidth||window.innerWidth)-36);
 return Math.min(.92,available/Math.max(1,width))*zoomLevel;
}
function applyPageLayout(renumber){
 var width=px(layout.widthTwips),height=px(layout.heightTwips),top=px(layout.topTwips),right=px(layout.rightTwips);
 var bottom=px(layout.bottomTwips),left=px(layout.leftTwips),scale=widthScale();
 // One shared style update scales all Word pages; do not walk hundreds of page nodes for each zoom tap.
 root.style.setProperty("--fz-shell-width",(width*scale)+"px");
 root.style.setProperty("--fz-shell-height",(height*scale)+"px");
 root.style.setProperty("--fz-page-gap",(28*scale)+"px");
 root.style.setProperty("--fz-page-width",width+"px");
 root.style.setProperty("--fz-page-height",height+"px");
 root.style.setProperty("--fz-page-padding",top+"px "+right+"px "+bottom+"px "+left+"px");
 root.style.setProperty("--fz-page-font-family",'"'+defaultFont.replace(/["\\]/g,"")+'",Arial,sans-serif');
 root.style.setProperty("--fz-page-transform","scale("+scale+")");
 root.style.setProperty("--fz-page-number-transform","scale("+scale+")");
 if(renumber===true){
  var numbers=root.querySelectorAll(".page-shell > .page-number");
  for(var i=0;i<numbers.length;i++)numbers[i].textContent="Page "+(i+1);
 }
}
function makePage(after){
 var shell=document.createElement("section");shell.className="page-shell";
 var page=document.createElement("article");page.className="fz-page";page.setAttribute("aria-label","Document page");
 var number=document.createElement("div");number.className="page-number";
 shell.appendChild(page);shell.appendChild(number);
 if(after&&shellOf(after))root.insertBefore(shell,shellOf(after).nextSibling);else root.appendChild(shell);
 applyPageLayout();return page;
}
function addPageAfter(page){return makePage(page)}
function registerFonts(css){
 if(!css)return;var style=document.getElementById("fz-font-face-rules");
 if(!style){style=document.createElement("style");style.id="fz-font-face-rules";document.head.appendChild(style)}
 style.textContent+=css;
}
function setDefaultFont(family){
 if(!family)return;defaultFont=String(family);
 root.style.setProperty("--fz-page-font-family",'"'+defaultFont.replace(/["\\]/g,"")+'",Arial,sans-serif');
}
function showNotice(title,message){
 notice.textContent="";var strong=document.createElement("strong"),body=document.createElement("span");
 strong.textContent=title;body.textContent=message;notice.appendChild(strong);notice.appendChild(body);notice.style.display="block";
}
function overflows(page){return page.scrollHeight>page.clientHeight+2}
function textMap(block){
 var walker=document.createTreeWalker(block,NodeFilter.SHOW_TEXT,{acceptNode:function(node){
  var parent=node.parentElement;return parent&&parent.closest("script,style,code,pre,[contenteditable='false']")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
 }});
 var nodes=[],total=0,all="";
 while(walker.nextNode()){var node=walker.currentNode;nodes.push({node:node,start:total,end:total+node.nodeValue.length});total+=node.nodeValue.length;all+=node.nodeValue}
 return{nodes:nodes,total:total,text:all};
}
function locate(map,offset){
 offset=Math.max(0,Math.min(map.total,offset));
 for(var i=0;i<map.nodes.length;i++){var item=map.nodes[i];if(offset<=item.end)return{node:item.node,offset:offset-item.start}}
 var last=map.nodes[map.nodes.length-1];return last?{node:last.node,offset:last.node.nodeValue.length}:null;
}
function fragment(block,map,start,end){
 if(!map.nodes.length)return document.createDocumentFragment();
 var a=locate(map,start),b=locate(map,end);if(!a||!b)return document.createDocumentFragment();
 var range=document.createRange();range.setStart(a.node,a.offset);range.setEnd(b.node,b.offset);return range.cloneContents();
}
function prefixFits(page,block,map,count){
 var temp=document.createElement("article");temp.className="fz-page fz-measure";
 temp.style.width=px(layout.widthTwips)+"px";temp.style.height=px(layout.heightTwips)+"px";
 temp.style.padding=px(layout.topTwips)+"px "+px(layout.rightTwips)+"px "+px(layout.bottomTwips)+"px "+px(layout.leftTwips)+"px";
 temp.style.fontFamily=page.style.fontFamily||'"'+defaultFont+'",Arial,sans-serif';
 var clone=block.cloneNode(false);clone.appendChild(fragment(block,map,0,count));temp.appendChild(clone);document.body.appendChild(temp);
 var fits=temp.scrollHeight<=temp.clientHeight+2;temp.remove();return fits;
}
function splitLongBlock(page,block){
 if(block&&block.getAttribute&&block.getAttribute("data-fz-keep-lines")==="true")return null;
 if(!/^(p|h1|h2|h3|h4|blockquote)$/i.test(block.tagName||""))return null;
 var map=textMap(block);if(map.total<80||!map.nodes.length)return null;
 var low=1,high=map.total-1,best=0;
 for(var n=0;n<18&&low<=high;n++){var mid=Math.floor((low+high)/2);if(prefixFits(page,block,map,mid)){best=mid;low=mid+1}else high=mid-1}
 if(best<24||best>=map.total-8)return null;
 while(best>24&&!/\\s/.test(map.text.charAt(best-1)))best--;
 if(best<24)return null;
 var first=fragment(block,map,0,best),second=fragment(block,map,best,map.total);
 var continuation=block.cloneNode(false);continuation.appendChild(second);
 block.innerHTML="";block.appendChild(first);
 var list=pages(),index=list.indexOf(page),next=list[index+1]||addPageAfter(page);
 next.insertBefore(continuation,next.firstChild);
 return continuation;
}
function splitTableOverflow(page,table){
 if(!table||String(table.tagName).toUpperCase()!=="TABLE")return false;
 var body=table.tBodies&&table.tBodies[0];
 if(!body||body.rows.length<2)return false;
 var continuation=table.cloneNode(false),nextBody=document.createElement("tbody"),moved=0;
 continuation.appendChild(nextBody);
 // Keep at least one row on this page. Move complete rows in reverse order,
 // then prepend them to the next page so reading order remains unchanged.
 while(overflows(page)&&body.rows.length>1){
  var row=body.rows[body.rows.length-1];
  nextBody.insertBefore(row,nextBody.firstChild);
  moved++;
 }
 if(!moved)return false;
 var list=pages(),index=list.indexOf(page),next=list[index+1]||addPageAfter(page);
 next.insertBefore(continuation,next.firstChild);
 return true;
}
function markOverflow(page){
 var shell=shellOf(page);if(!shell)return;
 shell.setAttribute("data-overflow","true");
 // An indivisible Word block (for example one extremely tall table row) must
 // remain readable. Expand this exceptional page instead of silently clipping it.
 page.style.height="auto";
 page.style.minHeight="var(--fz-page-height)";
 page.style.overflow="visible";
 var required=Math.max(px(layout.heightTwips),page.scrollHeight+8);
 shell.style.height=Math.ceil(required*widthScale())+"px";
}
function processPage(page){
 var guard=0;
 while(guard++<300){
  var children=Array.prototype.slice.call(page.children);
  if(!children.length)break;
  var breakIndex=children.findIndex(function(child){
   return child.classList&&child.classList.contains("fz-manual-break");
  });
  if(breakIndex>=0){
   var marker=children[breakIndex],following=children.slice(breakIndex+1);
   marker.remove();
   if(breakIndex>0&&following.length){
    var list=pages(),position=list.indexOf(page);
    var next=list[position+1]||addPageAfter(page);
    for(var k=following.length-1;k>=0;k--)next.insertBefore(following[k],next.firstChild);
    return;
   }
   continue;
  }
  if(!overflows(page))break;
  var last=children[children.length-1];
  if(last.tagName&&last.tagName.toUpperCase()==="TABLE"&&splitTableOverflow(page,last))continue;
  if(last.tagName&&/^(P|H1|H2|H3|H4|BLOCKQUOTE)$/i.test(last.tagName)&&
     last.getAttribute("data-fz-keep-lines")!=="true"&&splitLongBlock(page,last))continue;
  if(children.length===1){
   markOverflow(page);
   break;
  }
  var moveFrom=children.length-1;
  if(moveFrom>0&&children[moveFrom-1].getAttribute&&
     children[moveFrom-1].getAttribute("data-fz-keep-next")==="true")moveFrom--;
  var nextPage=pages()[pages().indexOf(page)+1]||addPageAfter(page);
  for(var m=children.length-1;m>=moveFrom;m--)nextPage.insertBefore(children[m],nextPage.firstChild);
 }
 if(!overflows(page))shellOf(page).removeAttribute("data-overflow");
 else markOverflow(page);
}
function paginate(){
 if(!ready)return;
 paginationBusy=true;
 var generation=++paginationGeneration,index=0;
 function step(){
  if(generation!==paginationGeneration)return;
  var started=Date.now(),processed=0;
  while(index<pages().length&&index<500&&(processed===0||Date.now()-started<8)){
   processPage(pages()[index]);
   index++;
   processed++;
  }
  if(index<pages().length&&index<500){
   requestAnimationFrame(step);
  }else{
   paginationBusy=false;
   applyPageLayout(true);
  }
 }
 requestAnimationFrame(step);
}
function renderDocument(state,watchFont){
 layout=state.pageLayout||{widthTwips:11906,heightTwips:16838,topTwips:1440,rightTwips:1440,bottomTwips:1440,leftTwips:1440};
 layout.widthTwips=Number(layout.widthTwips)||11906;layout.heightTwips=Number(layout.heightTwips)||16838;
 ["topTwips","rightTwips","bottomTwips","leftTwips"].forEach(function(key){
  layout[key]=Number(layout[key]);if(!Number.isFinite(layout[key]))layout[key]=1440;
 });
 root.innerHTML="";
 var page=makePage();
 var source=document.createElement("div");source.innerHTML=state.html||"<p></p>";
 while(source.firstChild)page.appendChild(source.firstChild);
 if(!page.childNodes.length)page.innerHTML="<p></p>";
 ready=true;notice.style.display="none";
 if(state.fontName&&state.fontAvailable)showNotice("Matching font loaded: "+state.fontName,"The original DOCX characters are displayed using the declared font. The source file is unchanged.");
 else if(state.fontName)showNotice("Legacy font missing: "+state.fontName,"Import this exact TTF/OTF family in Hindi Font Center. The original text remains unchanged.");
 else if(state.profile==="krutidev010"||state.profile==="devlys010")showNotice("Legacy font profile detected","Import the exact font family to render this document. Automatic conversion is disabled.");
 else if(state.legacyHint)showNotice("Possible legacy Hindi encoding","No exact font family is declared. Text remains unchanged; automatic conversion is disabled.");
 paginate();

 // Start with visible text immediately; if the selected local face is still loading,
 // rebuild from the untouched source HTML once it is ready so page breaks stay correct.
 if(watchFont&&document.fonts&&document.fonts.load&&!state.fontWatchStarted){
  state.fontWatchStarted=true;
  var fontSpec='16px "'+defaultFont.replace(/["\\]/g,"")+'"';
  try{
   if(!document.fonts.check(fontSpec)){
    document.fonts.load(fontSpec).then(function(loaded){
     if(loaded&&loaded.length&&lastDocument===state&&!state.fontRefreshDone){
      state.fontRefreshDone=true;
      renderDocument(state,false);
     }
    }).catch(function(){});
   }
  }catch(_){}
 }
}
function copyLayout(source){
 var fallback={widthTwips:11906,heightTwips:16838,topTwips:1440,rightTwips:1440,bottomTwips:1440,leftTwips:1440};
 var result={};
 Object.keys(fallback).forEach(function(key){
  var value=source&&Number(source[key]);
  result[key]=Number.isFinite(value)&&((key==="widthTwips"||key==="heightTwips")?value>0:value>=0)?value:fallback[key];
 });
 return result;
}
function setDocument(html,profile,fontName,legacyHint,fontAvailable,pageLayout){
 var original=copyLayout(pageLayout);
 lastDocument={
  html:html||"<p></p>",
  profile:profile||"",
  fontName:fontName||"",
  legacyHint:!!legacyHint,
  fontAvailable:!!fontAvailable,
  pageLayout:copyLayout(original),
  originalPageLayout:copyLayout(original),
  selectedPageSize:"original",
  fontWatchStarted:false,
  fontRefreshDone:false
 };
 renderDocument(lastDocument,true);
}
function setPageSize(preset){
 if(!lastDocument)return false;
 var paper={
  a4:[11906,16838],
  a4_landscape:[16838,11906],
  letter:[12240,15840],
  legal:[12240,20160],
  a3:[16838,23811],
  a5:[8391,11906]
 };
 if(preset==="original"){
  lastDocument.pageLayout=copyLayout(lastDocument.originalPageLayout);
 }else{
  var dimensions=paper[preset];
  if(!dimensions)return false;
  var next=copyLayout(lastDocument.pageLayout||lastDocument.originalPageLayout);
  next.widthTwips=dimensions[0];
  next.heightTwips=dimensions[1];
  var maxHorizontal=Math.max(0,Math.floor(next.widthTwips/2)-360);
  var maxVertical=Math.max(0,Math.floor(next.heightTwips/2)-360);
  next.leftTwips=Math.min(next.leftTwips,maxHorizontal);
  next.rightTwips=Math.min(next.rightTwips,maxHorizontal);
  next.topTwips=Math.min(next.topTwips,maxVertical);
  next.bottomTwips=Math.min(next.bottomTwips,maxVertical);
  lastDocument.pageLayout=next;
 }
 lastDocument.selectedPageSize=preset;
 renderDocument(lastDocument,false);
 return true;
}
function zoom(direction){zoomLevel=Math.max(.7,Math.min(1.5,zoomLevel+(direction>0?.1:-.1)));applyPageLayout()}
function fit(){zoomLevel=1;applyPageLayout()}
function pageCount(){return root.querySelectorAll(".page-shell").length}
function currentPage(){
 var shells=root.querySelectorAll(".page-shell"),mark=scroll.scrollTop+Math.max(24,scroll.clientHeight*.28),current=0;
 for(var i=0;i<shells.length;i++){if(shells[i].offsetTop<=mark)current=i;else break}
 return current
}
function goToPage(index){
 var shells=root.querySelectorAll(".page-shell");
 if(!shells.length)return;
 index=Math.max(0,Math.min(shells.length-1,Number(index)||0));
 shells[index].scrollIntoView({behavior:"smooth",block:"start"});
}
function pageStep(delta){goToPage(currentPage()+(Number(delta)||0))}
window.addEventListener("resize",applyPageLayout);
window.FZViewer={
 registerFonts:registerFonts,setDefaultFont:setDefaultFont,setDocument:setDocument,
 setPageSize:setPageSize,zoom:zoom,fit:fit,pageCount:pageCount,currentPage:currentPage,
 goToPage:goToPage,pageStep:pageStep
};
})();
</script>
</body>
</html>
