<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4">
<meta name="color-scheme" content="light">
<title>FZ Office Document Viewer</title>
<style>
:root{color-scheme:light;--ink:#1b342d;--muted:#718078;--paper:#fff;--canvas:#eef3f0;--line:#e3eae6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:"Noto Sans Devanagari",Arial,sans-serif;font-kerning:normal;text-rendering:optimizeLegibility}
body{padding:12px 8px 28px}
#legacyNotice{display:none;max-width:900px;margin:0 auto 10px;padding:12px 14px;border-radius:12px;background:#fff4dc;color:#6c4c12;font-size:12px;line-height:1.55;border:1px solid #f0dfb9}
#legacyNotice strong{display:block;margin-bottom:3px}
#page{width:100%;min-height:calc(100vh - 70px);margin:0 auto;padding:26px 20px 42px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px rgba(23,55,43,.06);font-size:16px;line-height:1.75;overflow-wrap:break-word;word-break:normal;font-family:"Noto Sans Devanagari",Arial,sans-serif;font-feature-settings:"kern" 1,"liga" 1;user-select:text;-webkit-user-select:text}
#page p,#page div{margin:0 0 12px;min-height:1.4em}
#page h1{font-size:1.65em;line-height:1.3;margin:0 0 14px}
#page h2{font-size:1.35em;line-height:1.35;margin:0 0 12px}
#page h3{font-size:1.15em;margin:0 0 10px}
#page ul,#page ol{padding-left:25px;margin:0 0 12px}
#page table{width:100%;border-collapse:collapse;table-layout:fixed;margin:12px 0}
#page td,#page th{border:1px solid #9eafa7;padding:7px;min-width:35px;vertical-align:top}
#page blockquote{border-left:3px solid #9ab8a9;margin:12px 0;padding:5px 12px;color:#52655c}
#page img{max-width:100%;height:auto}
#page a{color:#176b5b;text-decoration:underline}
@media(min-width:700px){body{padding:20px}#page{max-width:900px;min-height:100vh;padding:42px 54px}}
@media print{html,body{background:#fff;padding:0}#legacyNotice{display:none!important}#page{border:0;box-shadow:none;max-width:none;padding:0}}
</style>
</head>
<body>
<div id="legacyNotice" role="status"></div>
<main id="page" aria-label="Document content"></main>
<script>
(function(){
"use strict";
var page=document.getElementById("page"),notice=document.getElementById("legacyNotice"),defaultFont="Noto Sans Devanagari",pageScale=1,zoomLevel=1,lastLayout=null;
function registerFonts(css){if(!css)return;var style=document.getElementById("fz-font-face-rules");if(!style){style=document.createElement("style");style.id="fz-font-face-rules";document.head.appendChild(style)}style.textContent+=css}
function setDefaultFont(family){if(!family)return;defaultFont=String(family);var safe=defaultFont.replace(/["\\]/g,"");page.style.fontFamily='"'+safe+'","Noto Sans Devanagari",Arial,sans-serif'}
function showNotice(title,message){notice.textContent="";var strong=document.createElement("strong"),body=document.createElement("span");strong.textContent=title;body.textContent=message;notice.appendChild(strong);notice.appendChild(body);notice.style.display="block"}
function applyPageLayout(layout){
  lastLayout=layout||{};
  var widthTwips=Number(lastLayout.widthTwips)||11906;
  var heightTwips=Number(lastLayout.heightTwips)||16838;
  var topTwips=Number(lastLayout.topTwips),rightTwips=Number(lastLayout.rightTwips);
  var bottomTwips=Number(lastLayout.bottomTwips),leftTwips=Number(lastLayout.leftTwips);
  if(!Number.isFinite(topTwips))topTwips=1440;
  if(!Number.isFinite(rightTwips))rightTwips=1440;
  if(!Number.isFinite(bottomTwips))bottomTwips=1440;
  if(!Number.isFinite(leftTwips))leftTwips=1440;
  var widthPx=widthTwips/15,heightPx=heightTwips/15;
  var available=Math.max(260,window.innerWidth-(window.innerWidth<700?16:40));
  var renderedWidth=Math.min(widthPx,available,900);
  pageScale=renderedWidth/widthPx;
  page.style.width=widthPx+"px";
  page.style.maxWidth="none";
  page.style.minHeight=heightPx+"px";
  page.style.padding=[topTwips/15,rightTwips/15,bottomTwips/15,leftTwips/15].map(function(v){return Math.max(0,v)+"px"}).join(" ");
  page.style.fontSize="16px";
  page.style.zoom=(pageScale*zoomLevel);
}
function setDocument(html,profile,fontName,legacyHint,fontAvailable,layout){
  page.innerHTML=html||"<p></p>";
  applyPageLayout(layout);
  notice.style.display="none";
  page.style.fontFamily='"'+defaultFont.replace(/["\\]/g,"")+'","Noto Sans Devanagari",Arial,sans-serif';
  if(fontName&&fontAvailable){
    showNotice("Matching font loaded: "+fontName,
      "The original DOCX characters are rendered using their declared font. No conversion has been applied; the source file is unchanged.");
  }else if(fontName){
    showNotice("Legacy font missing: "+fontName,
      "Import this exact TTF/OTF family in Hindi Font Center. The original text and font declaration are unchanged.");
  }else if(profile==="krutidev010"||profile==="devlys010"){
    showNotice("Legacy font profile detected",
      "Import the exact font family to render this document. Automatic conversion is disabled.");
  }else if(legacyHint){
    showNotice("Possible legacy Hindi encoding",
      "No exact font family is declared. Text remains unchanged; automatic conversion is disabled.");
  }
}
function zoom(direction){zoomLevel=Math.max(.75,Math.min(2,zoomLevel+(direction>0?.1:-.1)));page.style.zoom=(pageScale*zoomLevel)}
window.addEventListener("resize",function(){applyPageLayout(lastLayout)});
window.FZViewer={registerFonts:registerFonts,setDefaultFont:setDefaultFont,setDocument:setDocument,zoom:zoom};
})();
</script>
</body>
</html>
