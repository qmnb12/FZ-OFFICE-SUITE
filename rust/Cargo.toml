[package]
name = "fz-office-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "FZ Office's native document engine"
license = "MIT"

[lib]
name = "fzcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.22.4"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
